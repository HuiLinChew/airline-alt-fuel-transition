# As alt_carbon_200, but the methane aircraft burn e-methane instead of fossil LNG.
# Switching fuel = point the aircraft type at the other fuel row, and offer that fuel.
name: alt_carbon_200_emethane
description: As alt_carbon_200 with e-methane instead of fossil LNG
objective: cost
fleet: {KER-NB: 100, LH2-NB: 100, CH4-NB: 100}   # no caps: as many aircraft of each type as the model wants
fuel_max_tier: {lh2: 1, ch4_e: 2}
carbon_price: 200
aircraft_overrides: {CH4-NB: {fuel: ch4_e}}
wtt_co2_kg_per_kg: {kerosene: 0, lh2: 0, ch4: 0}   # well-to-tank CO2 (kg per kg fuel), 0 until sourced
