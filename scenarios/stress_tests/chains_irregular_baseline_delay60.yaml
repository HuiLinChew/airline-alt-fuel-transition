# As chains_irregular_baseline, but each leg may leave up to 60 min late.
name: chains_irregular_baseline_delay60
description: Irregular chains timetable, kerosene-only fleet, departures may be delayed by up to 60 min
data_dir: data/dummy_chains_irregular
objective: cost
fleet: {KER-NB: 100}   # kerosene only, no cap
carbon_price: 0
max_delay_min: 60
sweep: {parameter: max_delay_min, values: [0, 10, 20, 30, 40, 50, 60, 90, 120]}
wtt_co2_kg_per_kg: {kerosene: 0, lh2: 0, ch4: 0}   # well-to-tank CO2 (kg per kg fuel), 0 until sourced
