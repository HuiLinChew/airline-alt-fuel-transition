[project]
name = "altfuel"
version = "0.1.0"
description = "Airline network fleet-transition model for alternative fuels (kerosene, LH2, methane)"
readme = "README.md"
authors = [
    { name = "Hui Lin Chew" }
]
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.15.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pulp>=2.9,<3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
