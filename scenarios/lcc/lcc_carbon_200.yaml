# Low-cost timetable with LH2 and CH4 aircraft and a 200 USD/t carbon price.
name: lcc_carbon_200
description: Low-cost timetable, LH2 and CH4 aircraft, 200 USD/t carbon price, nights at a base
data_dir: data/dummy_lcc
objective: cost
wtt_co2_kg_per_kg: {kerosene: 0, lh2: 0, ch4: 0}   # well-to-tank CO2 (kg per kg fuel), 0 until sourced
fleet: {KER-NB: 100, LH2-NB: 100, CH4-NB: 100}   # no caps: as many aircraft of each type as the model wants
fuel_max_tier: {lh2: 1, ch4: 2}  # as alt_carbon_200: no LH2 at DUB (tier 2)
carbon_price: 200
overnight_at_bases: true
