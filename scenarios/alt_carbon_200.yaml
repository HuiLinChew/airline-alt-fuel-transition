# High EU ETS case from Hoelzen et al. (2025): 200 USD/tCO2.
name: alt_carbon_200
description: LH2 and CH4 aircraft available, minimise cost with a 200 USD/t carbon price
objective: cost
fleet: {KER-NB: 30, LH2-NB: 6, CH4-NB: 6}
fuel_max_tier: {lh2: 1, ch4: 2}
carbon_price: 200
sweep: {parameter: carbon_price, values: [0, 50, 100, 150, 200, 250, 300, 350, 400]}
wtt_co2_kg_per_kg: {kerosene: 0, lh2: 0, ch4: 0}   # well-to-tank CO2 (kg per kg fuel), 0 until sourced
