# Four real days of Ryanair flying (EUROCONTROL, 17-20 Sep 2025), kerosene only.
# Build the data first: uv run scripts/make_ryanair_data.py <Flights file> 2025-09-17 4
name: ryanair_4d
description: Four real Ryanair days (aircraft whose 4 days are all known), kerosene only, nights at a night stop
data_dir: data/ryanair_4d
objective: cost
fleet: {KER-NB: 1000}   # no cap
overnight_at_bases: true
repeat: false           # real days: aircraft start and end where they really did
capacity_mode: "off"    # no runway or stand data for these airports yet
period_min: 5760      # 4 days
